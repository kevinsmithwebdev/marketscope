name: build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix packages/ui
      - run: npm ci --prefix services/api
      - run: npm run build:types --prefix services/api
      - run: npm ci --prefix apps/shell
      - run: npm ci --prefix apps/markets
      - run: npm ci --prefix apps/crypto
      - run: npm ci --prefix apps/economy
      - run: npm ci --prefix apps/watchlist
      - run: npm run lint
      - run: npm run format:check

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: services/api
        run: |
          npm ci
          npm test
          npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/ui
      - working-directory: apps/shell
        run: |
          npm ci
          npm test
          npm run build

  remotes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [markets, crypto, economy, watchlist]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix packages/ui
      - working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npm run build
